spring.application.name=demo7-gateway
# 网关统一入口端口（以后浏览器只访问9000，不直接访问8081/8082了）
server.port=9000
# Nacos注册中心
spring.cloud.nacos.server-addr=localhost:8848
spring.cloud.nacos.discovery.ip=127.0.0.1

# ========== 路由规则 ==========
# 规则1：浏览器访问 /a/xxx → 去掉/a前缀 → 转发给 demo5
#   例如：访问 9000/a/hello → 网关实际访问 8081/hello
spring.cloud.gateway.routes[0].id=demo5-route
spring.cloud.gateway.routes[0].uri=lb://demo5
spring.cloud.gateway.routes[0].predicates[0]=Path=/a/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 规则2：浏览器访问 /b/xxx → 去掉/b前缀 → 转发给 demo6
#   例如：访问 9000/b/hello → 网关实际访问 8082/hello
spring.cloud.gateway.routes[1].id=demo6-route
spring.cloud.gateway.routes[1].uri=lb://demo6
spring.cloud.gateway.routes[1].predicates[0]=Path=/b/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
