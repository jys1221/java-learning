spring.application.name=demo5
server.port=8081
# Nacos注册中心地址（电话簿在8848端口）
spring.cloud.nacos.server-addr=localhost:8848
# 强制注册本机IP（否则会注册成VMware虚拟网卡的192.168.64.1，其他服务访问不到）
spring.cloud.nacos.discovery.ip=127.0.0.1

# ========== 配置中心 ==========
# 启动时去Nacos拉取 dataId=demo5.properties 的配置
# optional: 表示即使Nacos里还没这个配置也不报错
spring.config.import=optional:nacos:demo5.properties
# 配置改了要能自动刷新
spring.cloud.nacos.config.refresh-enabled=true

# ========== Sentinel 熔断限流 ==========
# Sentinel控制台地址（在8858端口）
spring.cloud.sentinel.transport.dashboard=localhost:8858
